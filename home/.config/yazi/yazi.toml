[opener]
open = [
  { run = "xdg-open %s1", desc = "Open" },
]
browse = [{ run = "firefox %s", desc = "Firefox" }]
extract = [
  { run = "ouch d -y %s", desc = "Extract" },
]
edit = [
  { run = "${EDITOR:-vi} %s", desc = "Edit", block = true, for = "unix" },
]
view = [
  { run = "swayimg %s", desc = "View" },
]
play = [
  { run = "mpv --force-window %s", orphan = true, desc = "MPV" },
]

[open]
rules = [
  # Text"edit",
  { url = "*.link.desktop", use = ["browse", "edit"] },
  { mime = "text/html", use = ["edit", "browse", "open"] },
  { url = "*.desktop", use = ["open", "edit", "browse"] },
  { mime = "text/*", use = ["edit", "open"] },
  { mime = "application/{javascript,json}", use = "edit" },
  { mime = "inode/{empty,x-empty}", use = "edit" },
  # Image
  { mime = "image/*", use = "view" },
  # Media
  { mime = "{audio,video}/*", use = "play" },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = "extract" },
  # Fallback
  { url = "*", use = ["open", "edit"] },
]

[[plugin.prepend_previewers]]
url = "*.csv"
run = 'piper -- xan view "$1"'

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'
